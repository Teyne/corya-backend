<!doctype html>
<!--
  Template PDF récap d'appel — Corya
  ----------------------------------------------------------------------------
  Ouvrable directement dans un navigateur : un jeu de données factices est
  injecté par le <script id="corya-fixture"> ci-dessous quand aucune donnée
  réelle n'a été fournie. Cela permet d'itérer sur le design sans lancer le
  backend.

  Utilisation en prod (par src/services/pdf.ts) :
    1. Le service remplace le tag `<script id="corya-data" ...></script>`
       par un JSON echapé (jamais interpolé dans le HTML directement).
    2. Puppeteer charge le fichier, exécute le JS, obtient le rendu, imprime.

  Contraintes RESPECTÉES DANS CE FICHIER :
    - Aucune ressource externe. Polices system uniquement, aucun CDN,
      aucun <link>, aucune <img src="http...">. Le rendu doit être
      déterministe hors ligne.
    - Toute donnée injectée passe par .textContent (jamais innerHTML) — un
      transcript contenant `<script>` ne peut pas s'exécuter.
    - Les caractères < > & " ' sont neutralisés par textContent nativement.
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Récapitulatif d'appel — Corya</title>
    <style>
      /*
       * A4 portrait, marges tenues par @page. Puppeteer respecte @page
       * quand `format: 'A4'` est passé à `page.pdf()`.
       */
      @page {
        size: A4;
        margin: 18mm 16mm 20mm 16mm;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI',
          Helvetica, Arial, sans-serif;
        color: #1f2937;
        font-size: 11pt;
        line-height: 1.45;
        background: #ffffff;
      }
      .brand {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        border-bottom: 2px solid #0f766e; /* Corya blue-green accent */
        padding-bottom: 6mm;
        margin-bottom: 6mm;
      }
      .brand__title {
        font-size: 20pt;
        font-weight: 700;
        color: #0f766e;
        letter-spacing: -0.02em;
      }
      .brand__sub {
        color: #6b7280;
        font-size: 10pt;
      }
      .cabinet-name {
        font-size: 13pt;
        font-weight: 600;
        color: #111827;
        margin-bottom: 2mm;
      }
      .meta {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4mm 8mm;
        margin: 4mm 0 6mm 0;
        padding: 4mm 5mm;
        background: #f9fafb;
        border-left: 3px solid #0f766e;
        border-radius: 2px;
      }
      .meta__label {
        font-size: 9pt;
        color: #6b7280;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 1mm;
      }
      .meta__value {
        font-size: 11pt;
        color: #111827;
        font-weight: 500;
      }
      .section {
        margin-top: 6mm;
      }
      .section__title {
        font-size: 12pt;
        font-weight: 600;
        color: #0f766e;
        margin: 0 0 3mm 0;
        padding-bottom: 1mm;
        border-bottom: 1px solid #e5e7eb;
      }
      .action {
        padding: 4mm 5mm;
        border-radius: 3px;
        background: #ecfdf5;
        border-left: 3px solid #10b981;
        color: #065f46;
      }
      .action--warn {
        background: #fef3c7;
        border-left-color: #f59e0b;
        color: #92400e;
      }
      .action--danger {
        background: #fee2e2;
        border-left-color: #ef4444;
        color: #991b1b;
      }
      .summary {
        color: #374151;
        white-space: pre-wrap;
      }
      .transcript {
        font-family: 'Menlo', 'Consolas', 'Courier New', monospace;
        font-size: 9.5pt;
        line-height: 1.55;
        color: #1f2937;
        background: #f9fafb;
        border: 1px solid #e5e7eb;
        border-radius: 3px;
        padding: 4mm 5mm;
        white-space: pre-wrap;
        word-wrap: break-word;
      }
      .transcript__line {
        margin-bottom: 1.5mm;
      }
      .transcript__role {
        font-weight: 600;
        color: #0f766e;
        margin-right: 2mm;
      }
      .transcript__role--user {
        color: #6b7280;
      }
      .empty {
        color: #9ca3af;
        font-style: italic;
      }
      .footer {
        margin-top: 8mm;
        padding-top: 4mm;
        border-top: 1px solid #e5e7eb;
        color: #9ca3af;
        font-size: 8.5pt;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header class="brand">
      <div>
        <div class="brand__title">Corya</div>
        <div class="brand__sub">Récapitulatif d'appel</div>
      </div>
      <div class="brand__sub" id="corya-generated-at"></div>
    </header>

    <div class="cabinet-name" id="corya-cabinet-name"></div>

    <section class="meta">
      <div>
        <div class="meta__label">Date de l'appel</div>
        <div class="meta__value" id="corya-date"></div>
      </div>
      <div>
        <div class="meta__label">Durée</div>
        <div class="meta__value" id="corya-duree"></div>
      </div>
      <div>
        <div class="meta__label">Patient</div>
        <div class="meta__value" id="corya-patient"></div>
      </div>
      <div>
        <div class="meta__label">Téléphone</div>
        <div class="meta__value" id="corya-telephone"></div>
      </div>
      <div>
        <div class="meta__label">Motif</div>
        <div class="meta__value" id="corya-motif"></div>
      </div>
      <div>
        <div class="meta__label">Résultat</div>
        <div class="meta__value" id="corya-resultat"></div>
      </div>
    </section>

    <section class="section" id="corya-action-section">
      <h2 class="section__title">Action à prendre</h2>
      <div id="corya-action" class="action"></div>
    </section>

    <section class="section" id="corya-summary-section">
      <h2 class="section__title">Résumé</h2>
      <div class="summary" id="corya-summary"></div>
    </section>

    <section class="section">
      <h2 class="section__title">Transcript intégral</h2>
      <div class="transcript" id="corya-transcript"></div>
    </section>

    <div class="footer">
      Document généré automatiquement par Corya —
      contient des données de santé au sens de l'art. 5 al. 1 let. c nLPD.
      À traiter avec la même diligence qu'un dossier patient.
    </div>

    <!--
      Data injection point.
      In production, src/services/pdf.ts REPLACES the contents of this
      <script> tag with a JSON.stringify()'d dataset. In dev, when opened in
      a browser directly, the empty tag is left as-is and the fixture below
      kicks in.
    -->
    <script type="application/json" id="corya-data"></script>

    <!--
      Fallback fixture. Only fires if #corya-data is empty (i.e. the file was
      opened directly, not rendered by Puppeteer). Values are DELIBERATELY
      fictitious (no real name, no real number).
    -->
    <script type="application/json" id="corya-fixture">
      {
        "cabinet": { "nom": "Cabinet Test — Physiothérapie Renens" },
        "appel": {
          "date_appel": "2026-07-31T09:42:00.000Z",
          "duree_secondes": 96,
          "patient_nom": "Fictive",
          "patient_prenom": "Test-Prénom",
          "patient_telephone": "+41 78 000 00 00",
          "motif_appel": "Consultation pour douleur au dos",
          "resultat": "rdv_pris",
          "rdv_date": "2026-08-14T10:00:00.000Z",
          "rdv_praticien": "M. Testeur",
          "transcript": "Agent: Bonjour, cabinet de physiothérapie…\nUser: Bonjour, je souhaite prendre rendez-vous.\nAgent: Bien sûr, pouvez-vous me donner votre nom ?\nUser: Fictive Test.\nAgent: Merci. Pour quel motif ?\nUser: Douleur au dos depuis une semaine.\nAgent: Je vous propose le mercredi 14 août à 10h avec M. Testeur, ça vous convient ?\nUser: Parfait, merci.\nAgent: Rendez-vous confirmé. Bonne journée.",
          "summary": "Prise de rendez-vous pour douleur dorsale, RDV confirmé mercredi 14 août à 10h."
        }
      }
    </script>

    <script>
      (function () {
        'use strict';

        // ------------------------------------------------------------------
        // Data resolution: injected data wins; otherwise fall back to fixture.
        // The <script id="corya-data"> tag is present in prod but empty in
        // dev. Empty text => fixture. This lets the founder open the file in
        // a browser with a realistic-looking render.
        // ------------------------------------------------------------------
        function readJSON(id) {
          var el = document.getElementById(id);
          if (!el) return null;
          var t = (el.textContent || '').trim();
          if (t.length === 0) return null;
          try {
            return JSON.parse(t);
          } catch (e) {
            return null;
          }
        }
        var data = readJSON('corya-data') || readJSON('corya-fixture') || {};
        var cabinet = data.cabinet || {};
        var appel = data.appel || {};

        // ------------------------------------------------------------------
        // Safe setters — always via textContent. NEVER innerHTML on user data.
        // ------------------------------------------------------------------
        function setText(id, value) {
          var el = document.getElementById(id);
          if (!el) return;
          if (value === null || value === undefined || value === '') {
            el.textContent = '—';
            el.classList.add('empty-value');
          } else {
            el.textContent = String(value);
          }
        }

        // ------------------------------------------------------------------
        // Formatters
        // ------------------------------------------------------------------
        function formatDate(iso) {
          if (!iso) return null;
          var d = new Date(iso);
          if (isNaN(d.getTime())) return null;
          // Swiss French locale, includes time.
          try {
            return d.toLocaleString('fr-CH', {
              day: '2-digit',
              month: 'long',
              year: 'numeric',
              hour: '2-digit',
              minute: '2-digit',
            });
          } catch (e) {
            return d.toISOString();
          }
        }

        function formatDuree(secs) {
          if (typeof secs !== 'number' || !isFinite(secs) || secs < 0) return null;
          var m = Math.floor(secs / 60);
          var s = Math.floor(secs % 60);
          if (m === 0) return s + ' s';
          return m + ' min ' + (s < 10 ? '0' + s : s) + ' s';
        }

        function fullName(prenom, nom) {
          var parts = [];
          if (prenom) parts.push(prenom);
          if (nom) parts.push(nom);
          if (parts.length === 0) return null;
          return parts.join(' ');
        }

        // ------------------------------------------------------------------
        // Fill meta block
        // ------------------------------------------------------------------
        setText('corya-cabinet-name', cabinet.nom || 'Cabinet');
        setText('corya-generated-at', 'Généré le ' + formatDate(new Date().toISOString()));
        setText('corya-date', formatDate(appel.date_appel));
        setText('corya-duree', formatDuree(appel.duree_secondes));
        setText('corya-patient', fullName(appel.patient_prenom, appel.patient_nom));
        setText('corya-telephone', appel.patient_telephone);
        setText('corya-motif', appel.motif_appel);

        // ------------------------------------------------------------------
        // Résultat label + colored action box
        // ------------------------------------------------------------------
        var resultatLabels = {
          rdv_pris: 'Rendez-vous pris',
          message: 'Message à traiter',
          transfere: 'Appel transféré',
          urgence: 'Urgence signalée',
          echec: 'Échec (à rappeler)',
          refus: 'Refus / annulation'
        };
        var resultatLabel = resultatLabels[appel.resultat] || appel.resultat || '—';
        setText('corya-resultat', resultatLabel);

        var actionEl = document.getElementById('corya-action');
        if (actionEl) {
          actionEl.classList.remove('action--warn', 'action--danger');
          var actionText;
          switch (appel.resultat) {
            case 'rdv_pris':
              var when = appel.rdv_date ? formatDate(appel.rdv_date) : null;
              actionText =
                'Rendez-vous confirmé' +
                (when ? ' le ' + when : '') +
                (appel.rdv_praticien ? ' avec ' + appel.rdv_praticien : '') +
                '. Aucune action requise, à titre d’information.';
              break;
            case 'urgence':
              actionText = 'Urgence signalée par le patient. Rappeler dès que possible.';
              actionEl.classList.add('action--danger');
              break;
            case 'echec':
            case 'refus':
              actionText = 'Appel non concluant. À rappeler pour un suivi.';
              actionEl.classList.add('action--warn');
              break;
            case 'message':
              actionText = 'Message laissé par le patient. Traiter dans la journée.';
              actionEl.classList.add('action--warn');
              break;
            case 'transfere':
              actionText = 'Appel transféré à un praticien. Aucune action supplémentaire.';
              break;
            default:
              actionText = 'Résultat non catégorisé. Consulter le transcript ci-dessous.';
              actionEl.classList.add('action--warn');
          }
          actionEl.textContent = actionText;
        }

        // ------------------------------------------------------------------
        // Summary (optional — hide the whole section if absent)
        // ------------------------------------------------------------------
        var summarySection = document.getElementById('corya-summary-section');
        if (appel.summary && String(appel.summary).trim().length > 0) {
          setText('corya-summary', appel.summary);
        } else if (summarySection) {
          summarySection.style.display = 'none';
        }

        // ------------------------------------------------------------------
        // Transcript — split by newline, render with role labels.
        // Every write goes through textContent, so a line containing HTML
        // is rendered verbatim, never interpreted.
        // ------------------------------------------------------------------
        var transcriptEl = document.getElementById('corya-transcript');
        if (transcriptEl) {
          transcriptEl.textContent = '';
          var raw = typeof appel.transcript === 'string' ? appel.transcript : '';
          if (raw.trim().length === 0) {
            transcriptEl.textContent = '(transcript non disponible)';
            transcriptEl.classList.add('empty');
          } else {
            var lines = raw.split(/\r?\n/);
            for (var i = 0; i < lines.length; i++) {
              var line = lines[i];
              if (line.length === 0) continue;
              var div = document.createElement('div');
              div.className = 'transcript__line';

              // Heuristic: "Agent:" / "User:" / "Patient:" prefix.
              var m = /^([A-Za-zÀ-ÿ]+)\s*:\s*(.*)$/.exec(line);
              if (m) {
                var role = m[1];
                var rest = m[2];
                var roleSpan = document.createElement('span');
                roleSpan.className = 'transcript__role';
                if (/user|patient|caller/i.test(role)) {
                  roleSpan.className += ' transcript__role--user';
                  roleSpan.textContent = 'Patient :';
                } else {
                  roleSpan.textContent = 'Agent :';
                }
                div.appendChild(roleSpan);
                var textNode = document.createTextNode(rest);
                div.appendChild(textNode);
              } else {
                div.textContent = line;
              }
              transcriptEl.appendChild(div);
            }
          }
        }

        // Signal Puppeteer that rendering is complete. Not strictly required
        // (we do a `waitUntil: 'networkidle0'`) but useful during debugging.
        document.body.setAttribute('data-corya-ready', '1');
      })();
    </script>
  </body>
</html>
